# The checks that decide whether a commit is releasable, on every platform a
# release artifact targets.
#
# Called by ci.yml on push and pull_request. release.yml does not re-run
# these checks on a version tag: its require-green-ci.yml job gates the
# artifact builds on the recorded conclusion of ci.yml's run for the tagged
# commit — one definition here, one reader of its verdict, so CI and the
# release gate cannot drift, for the same reason scripts/ci-local.sh exists.
#
# What a green run of this workflow does NOT establish is that a release is
# safe to publish; see .githooks/pre-push, which is the gate that keeps a tag
# off a red commit in the first place. The green-CI gate is a `needs:` of the
# artifact builds only, so release.yml's `plan` job runs
# `dist host --steps=create` regardless of the verdict.
name: CI checks

on:
  workflow_call:

jobs:
  checks:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (pinned by rust-toolchain.toml)
        # Single source of truth for the toolchain version + components is
        # rust-toolchain.toml. `rustup show` provisions the pinned toolchain
        # (and its listed components) so CI runs the exact clippy/rustfmt that
        # `scripts/ci-local.sh` runs locally — no "stable drifts per-machine".
        run: rustup show

      - name: Install uv (required by uv-workspace e2e tests)
        uses: astral-sh/setup-uv@v5

      - name: Install Go (required by go-work e2e tests)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Node.js (required by npm-workspace e2e tests; ships npm 10+)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Configure git identity (required by sync merge/rebase tests)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Run CI checks
        # Single source of truth: scripts/ci-local.sh runs the same checks
        # locally and here.
        shell: bash
        run: ./scripts/ci-local.sh

  windows-check:
    # Release artifacts include windows-msvc. This job establishes that
    # everything in the crate COMPILES there — production and test code
    # alike — so a `#[cfg]` arm that exists only on unix fails here rather
    # than at release-tag time. A block gated `#[cfg(unix)]` with no windows
    # arm is not a compile error anywhere; it vanishes and the caller reports
    # success, so compiling the test surface is what keeps the tests that
    # cover such a block from silently ceasing to exist.
    #
    # It does NOT establish that anything PASSES on Windows. Executing the
    # suite there is windows-tests.yml's job, which is advisory and deliberately
    # outside this run, so a green run of THIS workflow still says nothing about
    # behaviour. Tests skipped `#[cfg(unix)]` for a stated reason are absent
    # from this job too — compiling them is not running them, and a skipped test
    # compiles trivially.
    name: Windows compile check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Check the whole crate compiles on Windows
        run: cargo check --locked --all-targets

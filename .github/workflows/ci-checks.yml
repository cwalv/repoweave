# The checks that decide whether a commit is releasable, on every platform a
# release artifact targets.
#
# Called by ci.yml on push and pull_request. release.yml does not re-run
# these checks on a version tag: its require-green-ci.yml job gates the
# artifact builds on the recorded conclusion of ci.yml's run for the tagged
# commit — one definition here, one reader of its verdict, so CI and the
# release gate cannot drift, for the same reason scripts/ci-local.sh exists.
#
# What a green run of this workflow does NOT establish is that a release is
# safe to publish; see .githooks/pre-push, which is the gate that keeps a tag
# off a red commit in the first place. The green-CI gate is a `needs:` of the
# artifact builds only, so release.yml's `plan` job runs
# `dist host --steps=create` regardless of the verdict.
name: CI checks

on:
  workflow_call:

jobs:
  checks:
    name: CI (${{ matrix.os }}${{ matrix.test-shard && format(', shard {0}', matrix.test-shard) || '' }})
    runs-on: ${{ matrix.os }}
    # The outer net: scripts/ci-local.sh bounds its own run (three hours by
    # default), and this sits above that bound plus the job's setup.
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the suite as eight jobs, each one share of every test
        # (scripts/ci-local.sh --test-shard): one job on its 3 cores did not
        # finish inside the bound. Shard 1 also runs every stage that is not
        # the suite. Changing the count means changing this list only.
        include:
          - os: ubuntu-latest
          - os: macos-latest
            test-shard: 1/8
          - os: macos-latest
            test-shard: 2/8
          - os: macos-latest
            test-shard: 3/8
          - os: macos-latest
            test-shard: 4/8
          - os: macos-latest
            test-shard: 5/8
          - os: macos-latest
            test-shard: 6/8
          - os: macos-latest
            test-shard: 7/8
          - os: macos-latest
            test-shard: 8/8

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (pinned by rust-toolchain.toml)
        # Single source of truth for the toolchain version + components is
        # rust-toolchain.toml. `rustup show` provisions the pinned toolchain
        # (and its listed components) so CI runs the exact clippy/rustfmt that
        # `scripts/ci-local.sh` runs locally — no "stable drifts per-machine".
        run: rustup show

      - name: Install uv (required by uv-workspace e2e tests)
        uses: astral-sh/setup-uv@v5

      - name: Install Go (required by go-work e2e tests)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Node.js (required by npm-workspace e2e tests; ships npm 10+)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Configure git identity (required by sync merge/rebase tests)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Run CI checks
        # Single source of truth: scripts/ci-local.sh runs the same checks
        # locally and here.
        shell: bash
        env:
          TEST_SHARD: ${{ matrix.test-shard }}
        run: ./scripts/ci-local.sh ${TEST_SHARD:+--test-shard="$TEST_SHARD"}

  git-floor:
    # The suite against the oldest git rwv runs on (MINIMUM_RELEASE in
    # src/git.rs), built from its release tarball by scripts/git-floor.sh. The
    # checks job runs the runner's own, much newer git; a command or option
    # newer than the floor that is used without a fallback is red only here.
    name: CI (oldest supported git)
    runs-on: ubuntu-latest
    timeout-minutes: 210

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Install uv (required by uv-workspace e2e tests)
        uses: astral-sh/setup-uv@v5

      - name: Install Go (required by go-work e2e tests)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Node.js (required by npm-workspace e2e tests; ships npm 10+)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install what building git needs
        run: sudo apt-get install -y --no-install-recommends zlib1g-dev

      - name: Cache the built git
        uses: actions/cache@v4
        with:
          path: ~/.cache/rwv/git-floor
          key: git-floor-${{ runner.os }}-${{ hashFiles('scripts/git-floor.sh', 'src/git.rs') }}
          restore-keys: git-floor-${{ runner.os }}-

      - name: Configure git identity (required by sync merge/rebase tests)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Run the suite against the oldest supported git
        shell: bash
        run: ./scripts/ci-local.sh --stages=git-floor

  windows-check:
    # Release artifacts include windows-msvc. This job establishes that
    # everything in the crate COMPILES there — production and test code
    # alike — so a `#[cfg]` arm that exists only on unix fails here rather
    # than at release-tag time. A block gated `#[cfg(unix)]` with no windows
    # arm is not a compile error anywhere; it vanishes and the caller reports
    # success, so compiling the test surface is what keeps the tests that
    # cover such a block from silently ceasing to exist. It lints the same
    # surface, since a lint on a `#[cfg(windows)]` item fires nowhere else.
    #
    # It does NOT establish that anything PASSES on Windows. Executing the
    # suite there is windows-tests.yml's job, which is advisory and deliberately
    # outside this run, so a green run of THIS workflow still says nothing about
    # behavior. Tests skipped `#[cfg(unix)]` for a stated reason are absent
    # from this job too — compiling them is not running them, and a skipped test
    # compiles trivially.
    name: Windows compile check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Check the whole crate compiles on Windows
        # With the feature the test stages build, so the code it compiles in
        # compiles here too; the lint below builds what releases ship.
        run: cargo check --locked --all-targets --features test-pause

      - name: Lint the whole crate on Windows
        # clippy.toml's bans cover cfg(windows) code only in a Windows-target
        # run; scripts/ci-local.sh's windows stage runs the same lint
        # cross-target where the target is installed.
        run: cargo clippy --locked --all-targets -- -D warnings

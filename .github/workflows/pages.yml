# Publishes the documentation site after each release, and on demand.
#
# The site's content is release tags only: scripts/assemble-docs-site.py
# builds every v* tag's book from that tag's own tree. The checked-out commit
# supplies only the machinery, and for a workflow_run event GitHub runs and
# checks out the default branch's head, so a fix there reaches every version
# on the next run.
name: Deploy docs to GitHub Pages

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A Release run also completes for every pull request, and for a tag push
    # that failed. head_branch holds the tag name when a tag push started the
    # run; the test is publish-shims.yml's.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       contains(github.event.workflow_run.head_branch, '.'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          # Pin: mdbook 0.5.3 + mdbook-mermaid 0.17.0 are the verified compatible pair.
          # mdbook-mermaid 0.17.0 requires mdbook 0.5.x (mdbook-preprocessor protocol);
          # older mdbook-mermaid (<= 0.14.x) only supports mdbook 0.4.x.
          mdbook-version: "0.5.3"

      - name: Install mdbook-mermaid
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook-mermaid@0.17.0

      - name: Read the site's address
        id: pages
        uses: actions/configure-pages@v5

      - name: Build every release's book
        run: >-
          python scripts/assemble-docs-site.py --repo .
          --site-path "${{ steps.pages.outputs.base_path }}/"
          --out "${{ runner.temp }}/site"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

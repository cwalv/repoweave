name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          # Pin: mdbook 0.5.3 + mdbook-mermaid 0.17.0 are the verified compatible pair.
          # mdbook-mermaid 0.17.0 requires mdbook 0.5.x (mdbook-preprocessor protocol);
          # older mdbook-mermaid (<= 0.14.x) only supports mdbook 0.4.x.
          mdbook-version: "0.5.3"

      - name: Install mdbook-mermaid
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook-mermaid@0.17.0

      - name: Generate mermaid assets
        run: mdbook-mermaid install .

      - name: Build docs
        run: mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

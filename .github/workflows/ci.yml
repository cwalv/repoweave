# A successful run of this workflow on a commit is what .githooks/pre-push
# requires before it will let a version tag on that commit reach the remote.
# The hook keys on this workflow's file name and overall conclusion, not on
# individual job names, so the matrix in ci-checks.yml can grow a platform
# without the hook needing to hear about it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: ./.github/workflows/ci-checks.yml

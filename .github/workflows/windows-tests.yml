# Runs the test suite on Windows. Advisory: nothing in this repository gates on
# its result, and it must stay that way until the expected-failure list is
# empty.
#
# WHY THIS IS A WORKFLOW OF ITS OWN, WHICH IS THE WHOLE DESIGN
#
# Two gates refuse a release unless CI concluded `success` on the exact commit,
# and both ask for it by workflow FILE name:
#
#   .githooks/pre-push                      refuses to push a version tag
#   .github/workflows/require-green-ci.yml  refuses to build release artifacts
#
# Both query `workflows/ci.yml/runs?head_sha=...` and read
# `.workflow_runs[0].conclusion`. And .github/workflows/ci.yml is a thin
# caller — its only job is `uses: ./.github/workflows/ci-checks.yml` — so a job
# added to ci-checks.yml lands inside the run those two gates read.
#
# That is not an accident to work around; it is a property those files were
# written to have. require-green-ci.yml says so above its own query: keyed on
# the workflow file and its overall conclusion rather than on job names, so a
# new platform in ci-checks.yml is covered without that file hearing about it.
# Marking a job there `continue-on-error` would not be using an escape hatch,
# it would be defeating the one property the gate was built for — and it would
# rest on a claim about how GitHub concludes a run that no file here states.
# A separate workflow file produces a separate run, which neither query names.
# That is provable by reading the two gates.
#
# It has to be outside their reach because this job is EXPECTED to be red at
# first. A job likely red on its first run, placed where pre-push can see it,
# blocks every release until someone fixes it — which is the failure that hook
# exists to prevent, and its provenance is v0.15.0 and v0.16.0 shipping with
# macOS red.
#
# DO NOT add this workflow to required status checks, and do not reference it
# from either gate, until the list below is empty and a run has been green on a
# commit nobody special-cased. Required status checks are a repository SETTING
# and are not tracked in this tree, so whether a red run here can block a merge
# is not answerable by reading the repository. That is why this runs on pushes
# to main and on demand, and not on pull requests.
#
# WHAT A GREEN RUN HERE WOULD MEAN, AND WHAT IT WOULD NOT
#
# It would not mean the tests pass on Windows, for two separate reasons.
#
# FIRST, a set of tests does not EXIST there — `#[cfg(unix)]` on the test, or
# a file-level `#![cfg(unix)]` — so they neither run nor report, and a suite is
# green over their absence exactly as it is over their success. Each states its
# reason at its own site, and they fall into three groups:
#
#   plugin discovery and dispatch. Windows has no executable bit and lookup
#   selects on PATHEXT, so what a discoverable plugin is even NAMED there is
#   an undecided product question, not a porting task.
#
#   hook, permission and rename fixtures. The settled ones are pinned by
#   tests/hook_fixture_portability_test.rs; the rest are gated on an ACL deny
#   entry, a PATH shim Windows will not spawn, or an inode instrument NTFS may
#   not honour.
#
#   an #[ignore]d static-files placeholder, which runs on no platform.
#
# This section carried a total and a count per group until they were wrong.
# They are derived from the tree, so they rot the moment anyone gates another
# test, and a corrected count is the same defect re-armed with a fresh clock.
# If a magnitude is worth having, derive it then — and note that `cfg(unix)`
# also gates helpers and whole files, so a raw grep is not a test count. Read
# the sites instead: whether an absence is acceptable turns on the REASON, and
# only the site carries that.
#
# SECOND, and this is the harder one to see: a test can be PRESENT here,
# EXECUTED here, and GREEN here while proving nothing, because its fixture
# never engaged. That is not hypothetical. `ledger_anchors_to_the_named_
# directory` in src/integrations/merge.rs was measurably vacuous until it was
# given a read-back assertion: the code under test read the ledger file and
# never joined the directory onto it, so no assertion in the old body ever
# resolved the symlink its fixture built. No-op the symlink creation with the
# new assertion present and it goes red; remove that assertion and the same
# mutation passes. Absent tests can at least be counted. These cannot.
#
# Whatever that set's size, it is a floor. It holds only tests absent by
# `cfg`; a test that exists here and fails for a reason nobody predicted is
# what this job is for.
#
# Symlink CREATION is not among the reasons, which is worth recording because
# it was the obstacle most expected. GitHub's Windows runner images enable
# Developer Mode at image build time and the runner user is an administrator
# with UAC disabled, while Rust's symlink_file/symlink_dir pass
# SYMBOLIC_LINK_FLAG_ALLOW_UNPRIVILEGED_CREATE — so both sufficient conditions
# hold. That is documentation-derived, not observed. This workflow is the thing
# that would observe it.
#
# WHAT A RED RUN HERE COUNTS, AND WHAT IT DOES NOT
#
# A third category sits beside those two, and it is neither absent nor
# vacuous: a test that EXISTS here, is not gated, compiles, and NEVER RUNS.
# `cargo test` builds one binary per target and runs them in sequence, and
# without --no-fail-fast it stops at the first binary that fails. The lib
# target goes first. So one failing unit test ends the command before any file
# in tests/ has started, and what cargo prints as it gives up —
# `error: test failed, to rerun pass --lib` — names the target it stopped at
# without saying that it stopped.
#
# What separates a small suite from a truncated one is the number of
# `test result:` lines cargo prints for its OWN targets: one per binary that
# ran, plus one for the doctests. DERIVE that total when you read a log, rather
# than trusting one written here — ask cargo what it built, and add the
# doctests, which build no executable:
#
#     echo $(( $(cargo test --no-run 2>&1 | grep -c '^ *Executable ') + 1 ))
#
# Ask CARGO rather than counting files. A `ls tests/*.rs` plus `ls src/bin/*.rs`
# undercounts by one, because `src/main.rs` is a bin target that lives in
# neither, and a `[[bin]]` section could add more that no directory listing
# shows.
#
# It does not move with the platform, because a file gated `#![cfg(unix)]`
# still builds and still reports zero tests, so it costs a line either way.
# Fewer than that means the command stopped early. ONE means it never left the
# lib target.
#
# This carried a frozen total until someone measured it and found it ~35 short
# of the tree. That is worse than untidy, and it is why the number had to go
# rather than be corrected: the comparison is "fewer than that means it stopped
# early", so a stale-LOW total lets a run that truncated ~25 binaries short
# clear the threshold and read as complete. It failed in the safe-looking
# direction, which is exactly why it sat unnoticed. A derived total cannot.
#
# Match on the crate name each line carries, not on a raw count and not on the
# target name, because three lines in a complete log are not cargo's.
# tests/e2e_cargo_test.rs assembles a two-crate fixture workspace and drives
# `cargo test --workspace` over it as a child process, which writes to the
# harness's real stdout instead of being captured by it, so that workspace's
# lib, bin and doctest results interleave with ours. The target name does not
# tell them apart — the fixture's lib is also `unittests src/lib.rs`, and that
# string appears twice in a complete log. What separates them is the crate: the
# binary path in parentheses names it, and the doctest line is `Doc-tests`
# followed by it. Whether those three lines are there at all depends on that
# test reaching its last step, which is the other reason a bare total is the
# wrong thing to compare.
#
# The first eight runs of this workflow each printed one. Every failure count
# quoted from this job before --no-fail-fast was added therefore described the
# lib target alone while reading as the suite's — the integration tests had
# never executed on this platform at all, which makes their behaviour here
# unknown rather than passing, and puts them in neither of the two categories
# above.
#
# The flag does not change what the job concludes. cargo still exits non-zero
# when any test failed, so a red suite is still a red run and every reason
# above for keeping this workflow outside the release gates' reach is
# untouched. What it buys is that the red belongs to the whole suite rather
# than to whichever target happened to run first.
name: Windows tests (advisory)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-tests:
    name: Test suite on Windows (advisory, not a gate)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Install uv (required by uv-workspace e2e tests)
        uses: astral-sh/setup-uv@v5

      - name: Configure git identity (required by sync merge/rebase tests)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Run the test suite
        # Tests only. rustfmt, rustdoc and the explain-artifact drift check ask
        # questions whose answers do not vary by platform, and ci-checks.yml
        # already answers them on two.
        #
        # Clippy is left out for a reason that outlives that one. A test skipped
        # on this platform strands its helpers as unreferenced code here, which
        # is a warning rather than an error only because no job on this runner
        # denies warnings. scripts/ci-local.sh does deny them, so adding clippy
        # here would turn every stated skip into a hard failure and make the
        # honest thing — leaving a test out with its reason at the site — the
        # expensive one.
        #
        # Debug rather than the release profile scripts/ci-local.sh uses: this
        # run exists to find out WHICH tests fail, and the debug build reaches
        # that answer sooner. Two consequences worth stating rather than
        # discovering. A divergence from ci-local.sh is normally a defect —
        # that script exists so local and CI cannot drift — and it is tolerable
        # only because nothing releasable is decided here. And a red list
        # gathered in debug is not authoritative for release: overflow checks
        # are on here and off there, and timing differs, so a test that fails
        # one way may not fail the other.
        #
        # --no-fail-fast is what makes the red list a list. Without it cargo
        # stops at the first target that fails, and since the lib target runs
        # first and has failed every time, no integration binary had ever
        # started here. The header above says how to read a log for that.
        shell: bash
        run: cargo test --locked --no-fail-fast

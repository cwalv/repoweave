[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoweave"
# Sentinel: rewritten by .github/workflows/publish-shims.yml at release time
# from the git tag (see the "Update version in pyproject.toml" step). A real
# value here would silently go stale; 0.0.0 makes the placeholder obvious if
# anyone ever installs from a working tree (e.g. `pip install -e python/repoweave`).
version = "0.0.0"
description = "A cross-repo workspace manager"
license = "MIT"
requires-python = ">=3.8"
keywords = ["workspace", "monorepo", "git", "multi-repo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Repository = "https://github.com/cwalv/repoweave"

# No [project.scripts]: the native rwv binary is shipped in the wheel's
# .data/scripts/ directory (via cargo-dist / build_wheels.py) and lands in
# bin/rwv directly at install time. Matches ruff and uv, which use the same
# packaging approach and ship no console-script entry points.

[tool.hatch.build.targets.wheel]
packages = ["src/repoweave"]

[package]
name = "repoweave"
version = "0.24.0"
edition = "2021"
description = "A cross-repo workspace manager"
license = "MIT"
repository = "https://github.com/cwalv/repoweave"
homepage = "https://cwalv.github.io/repoweave/"
keywords = ["workspace", "monorepo", "git", "multi-repo"]
categories = ["development-tools", "command-line-utilities"]
# generate-explain regenerates this repo's committed docs; it is a maintainer
# tool, left out of the published crate so the published package carries
# what every release channel ships: rwv and its bundled plugins.
exclude = ["src/bin/generate-explain.rs"]

[[bin]]
name = "rwv"
path = "src/main.rs"

# The bundled `rwv each` plugin. It shares this package so every release
# channel ships it beside `rwv`, but it is a plugin like any other: its source
# never names the library, and generate-explain's boundary check enforces that.
[[bin]]
name = "rwv-each"
path = "src/bin/rwv-each/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order"] }
which = { version = "7", features = ["regex"] }
clap_complete = "4"
schemars = "0.8"
# `regex` powers repo-subset filters' `re:` selectors; `globset` powers
# their `glob:` selectors. Both are widely-used pattern crates (ripgrep /
# cargo-ecosystem); `globset` is path-tuned and smaller than pulling in
# `glob` for the same job.
regex = "1.12.3"
globset = "0.4.18"
dirs = "6.0.0"
# Format-preserving TOML parser for the shared merge helper: preserves
# comments, key order, and decorations, which is required for the
# hybrid-merge contract on cargo/uv (Cargo.toml, pyproject.toml). serde + toml
# round-trips would clobber user-authored profile blocks, lint policy, etc.
toml_edit = "0.22"
# Serde front-end for rwv's own manifest. Distinct from `toml_edit` above by
# intent: that one preserves comments and key order because rwv merges into
# files a user also edits; the manifest round-trip is destructive by design
# (`Manifest::write` replaces the file), so the manifest wants a plain serde
# codec and none of the decoration machinery. `toml` is a facade over the same
# `toml_edit` version already resolved here, so this adds an API, not a second
# TOML parser.
toml = "0.8"
# For gita hardening: `csv` provides RFC-4180-compliant quoting so repo
# paths containing commas, quotes, or newlines are emitted as valid CSV
# rather than corrupting the output.
csv = "1"
# For recorded-digest verify of fully-owned generated files: rwv cannot
# recompute ecosystem lockfile content (cargo/uv/npm own the generation and
# it depends on registry state), so verify() compares on-disk content
# against a SHA-256 digest recorded when rwv last accepted a generation.
# `sha2` is the canonical RustCrypto implementation; pure compute, no I/O or
# network.
sha2 = "0.10"
# Copy-on-write clones for files shared between a member's workspaces: Linux
# FICLONE, macOS clonefile and Windows block cloning behind one call, which
# fails rather than copying where the filesystem cannot clone.
reflink-copy = "0.1.30"
# Reads pnpm-workspace.yaml's `packages:` key — a foreign, user-authored file
# whose shape rwv does not control, unlike rwv's own YAML. Chosen over the
# serde_yaml forks: serde_yaml_ng still sits on unsafe-libyaml, and serde_yml
# carries a published unsoundness advisory and an archived upstream. Chosen
# over yaml-rust2 for a fresher release cadence and full YAML-1.2 compliance
# (yaml-rust2 targets an older subset). Pure Rust, no C bindings.
# `default-features = false` drops its encoding-detection feature, which is
# moot once the file is already decoded to a UTF-8 `&str`.
saphyr = { version = "0.0.11", default-features = false }
# Strips the `\\?\` extended-length prefix off the paths rwv hands `git` as
# arguments. Windows `canonicalize` always returns that form, every path
# derived from the canonicalized weave root inherits it, and `git worktree
# add` refuses a destination spelled `//?/C:/...`. Chosen over a hand-rolled
# strip because the whole correctness of one lives in the predicate for when
# the prefix must be KEPT — over the legacy length limit, a UNC share, a
# reserved device name — which is knowledge about Windows that no run on a
# Unix host can exercise. `dunce::simplified` is also the identity on
# non-Windows, so the call sites take no `cfg` pair. No dependencies, no I/O.
dunce = "1.0.5"
# Cargo's own requirement/version matcher, for the derived-mode patch
# precheck (`version_satisfies`). Matches cargo's caret/tilde/wildcard
# semantics exactly instead of re-deriving them by hand. No default
# features: this crate only parses and compares, never touches a registry.
semver = { version = "1", default-features = false }
# rwv-each's children run in a process group (Unix) or job object (Windows)
# so a timeout or Ctrl-C reaches every descendant. Default features pull in
# `tracing` and the tokio API; neither is wanted.
process-wrap = { version = "10", default-features = false, features = ["std", "process-group", "job-object"] }
# rwv-each's Ctrl-C handler. `termination` widens it to SIGTERM and SIGHUP.
ctrlc = { version = "3.5", features = ["termination"] }

[target.'cfg(unix)'.dependencies]
# rwv-each hands the terminal to a `-j 1` child's process group and takes it
# back, as a job-control shell does, so interactive commands are not stopped
# by SIGTTIN/SIGTTOU.
nix = { version = "0.31", default-features = false, features = ["process", "signal", "term"] }

[target.'cfg(windows)'.dependencies]
# rwv-each joins a kill-on-close job object so its children die with it if it
# is killed, and disarms that on a normal exit.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[target.'cfg(windows)'.dev-dependencies]
# Tests raise Ctrl-C in a console of their own to interrupt a foreground job.
windows = { version = "0.62", features = ["Win32_System_Console"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

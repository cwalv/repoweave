[package]
name = "repoweave"
version = "0.5.0"
edition = "2021"
description = "A cross-repo workspace manager"
license = "MIT"
repository = "https://github.com/cwalv/repoweave"
homepage = "https://cwalv.github.io/repoweave/"
keywords = ["workspace", "monorepo", "git", "multi-repo"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "rwv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"
serde_json = "1"
which = "7"
clap_complete = "4"
schemars = "0.8"
# Added for fo-9kweo (repo-subset filters). `regex` powers `re:` selectors;
# `globset` powers `glob:` selectors. Both are widely-used pattern crates
# (ripgrep / cargo-ecosystem); `globset` is path-tuned and smaller than
# pulling in `glob` for the same job.
regex = "1.12.3"
globset = "0.4.18"
dirs = "6.0.0"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
